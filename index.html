<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Responsive Web Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MySite</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<header id="home" class="bg-primary text-white text-center p-5">
    <h1>Welcome to My Responsive Template</h1>
    <p>Using Bootstrap 5</p>
</header>

<section id="about" class="container py-5">
    <h2 class="mb-3">About Us</h2>
    <p>This is a sample responsive website template built with Bootstrap.</p>
</section>

<section id="services" class="bg-light py-5">
    <div class="container">
        <h2 class="mb-3">Services</h2>
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="p-3 border rounded shadow-sm">Service 1</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="p-3 border rounded shadow-sm">Service 2</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="p-3 border rounded shadow-sm">Service 3</div>
            </div>
        </div>
    </div>
</section>

<section id="contact" class="container py-5">
    <h2>Contact Us</h2>
    <form>
        <input type="text" class="form-control mb-2" placeholder="Your Name">
        <input type="email" class="form-control mb-2" placeholder="Your Email">
        <textarea class="form-control mb-2" placeholder="Message"></textarea>
        <button class="btn btn-primary">Send</button>
    </form>
</section>

<footer class="bg-dark text-white text-center p-3">
    &copy; 2025 MySite. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
